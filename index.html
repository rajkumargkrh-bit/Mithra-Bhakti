<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211633">
  <meta name="description" content="Mithra Bhakti — your personal devotional space for books, music, videos and memories.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/songs.css">
  <link rel="stylesheet" href="css/songs-plus.css?v=1">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/menu.css?v=13">
  <link rel="stylesheet" href="css/panchangam.css">
  <link rel="stylesheet" href="css/player-plus.css">
  <link rel="stylesheet" href="css/player-phase4.css?v=1">
  <link rel="stylesheet" href="css/bhakti-plus.css">
  <link rel="stylesheet" href="css/books-plus.css?v=1">
  <link rel="stylesheet" href="css/daily-bhakti-tracker.css?v=1">
  <link rel="stylesheet" href="css/festival-plus.css?v=1">
  <link rel="stylesheet" href="css/dashboard-plus.css?v=1">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
  <title>Mithra Bhakti</title>
</head>
<body>
  <div id="splash" class="splash" aria-label="Mithra Bhakti loading">
    <div class="splash-mark">✦</div>
    <div class="splash-name">MITHRA <span>BHAKTI</span></div>
    <div class="splash-tag">உங்கள் பக்தி உலகம்</div>
    <div class="splash-loader"></div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button class="brand" data-page="dashboard" aria-label="Go to dashboard">
        <span class="brand-mark">✦</span><span><b>MITHRA BHAKTI</b><small>உங்கள் பக்தி உலகம்</small></span>
      </button>
      <button class="icon-btn" id="quickSettings" aria-label="Settings">⚙</button>
    </header>

    <main id="pageContent" class="page-content"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="dashboard"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-page="calendar"><span>▦</span><small>Calendar</small></button>
      <button class="nav-item" data-page="advancedMusic"><span>♫</span><small>Player</small></button>
      <button class="nav-item" data-page="more"><span>☰</span><small>Menu</small></button>
    </nav>
  </div>

  <input id="filePicker" type="file" hidden multiple>
  <input id="backupPicker" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status"></div>
  <div id="mbDialog" class="mb-dialog hidden" aria-hidden="true" role="presentation">
    <section class="mb-dialog-card" role="dialog" aria-modal="true" aria-labelledby="mbDialogTitle">
      <div class="mb-dialog-emblem">✦</div>
      <div class="eyebrow">MITHRA BHAKTI</div>
      <h2 id="mbDialogTitle">Mithra Bhakti</h2>
      <p id="mbDialogMessage"></p>
      <input id="mbDialogInput" class="input hidden" autocomplete="off">
      <div class="mb-dialog-actions"><button id="mbDialogCancel" class="btn soft">Cancel</button><button id="mbDialogOk" class="btn gold">Continue</button></div>
    </section>
  </div>
  <script src="js/database.js"></script>
  <script src="js/app.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/features.js"></script>
  <script src="js/player-plus.js"></script>
  <script src="js/player-phase4.js?v=2"></script>
  <script src="js/panchangam.js"></script>
  <script src="js/bhakti-plus.js"></script>
  <script src="js/books-plus.js?v=1"></script>
  <script src="js/daily-bhakti-tracker.js?v=1"></script>
  <script src="js/festival-plus.js?v=1"></script>
  <script src="js/dashboard-plus.js?v=1"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
    }
  </script>
</body>
</html>
